<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タイセイ建工 日報入力</title>
  <style>
    :root { color-scheme: light; --navy:#163a5f; --blue:#2576b7; --pale:#eef5fa; --line:#cbd8e3; --red:#b52a2a; }
    * { box-sizing:border-box; }
    body { margin:0; overflow-x:hidden; font-family:"Yu Gothic UI","Meiryo",sans-serif; color:#152534; background:#f3f6f8; }
    header { background:var(--navy); color:#fff; padding:22px max(22px,calc((100% - 1050px)/2)); }
    h1 { margin:0; font-size:26px; } header p { margin:7px 0 0; opacity:.9; }
    main { max-width:1050px; margin:24px auto 48px; padding:0 18px; }
    section { background:#fff; border:1px solid var(--line); border-radius:10px; padding:20px; margin:18px 0; box-shadow:0 1px 2px #0000000d; }
    h2 { margin:0 0 15px; font-size:19px; color:var(--navy); }
    .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
    .wide { grid-column:span 2; } label { display:block; font-weight:700; font-size:14px; }
    input, select, textarea { width:100%; min-height:44px; margin-top:6px; border:1px solid #98adbd; border-radius:6px; padding:10px; font:inherit; background:#fff; }
    textarea { min-height:66px; resize:vertical; } .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
    button { min-height:44px; border:0; border-radius:6px; padding:11px 17px; color:#fff; background:var(--blue); cursor:pointer; font-weight:700; font-size:15px; }
    button.secondary { background:#64798c; } button.danger { background:#a84646; } button:focus, input:focus, textarea:focus, select:focus { outline:3px solid #a7d2ef; outline-offset:1px; }
    .notice { padding:12px 14px; background:var(--pale); border-left:4px solid var(--blue); line-height:1.6; }
    .error { color:var(--red); min-height:1.4em; margin:12px 0 0; font-weight:700; }
    table { width:100%; border-collapse:collapse; font-size:14px; } th,td { border-bottom:1px solid var(--line); padding:10px 7px; text-align:left; vertical-align:top; } th { background:#f1f5f8; white-space:nowrap; }
    .empty { color:#667; padding:15px 0; } .count { font-size:14px; color:#456; margin:0 0 10px; }
    .workers { margin-top:18px; border-top:1px solid var(--line); padding-top:16px; } .workers h3 { margin:0 0 10px; font-size:16px; color:var(--navy); }
    .worker-row { display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:10px; align-items:end; margin:10px 0; padding:12px; background:#f6f9fb; border-radius:7px; }
    .worker-row label { font-size:13px; } .worker-row button { padding:10px 12px; }
    dialog { width:min(900px,calc(100% - 28px)); border:0; border-radius:10px; padding:0; box-shadow:0 18px 60px #0008; } dialog::backdrop { background:#00192c88; }
    .dialog-body { padding:22px; } pre { white-space:pre-wrap; overflow-wrap:anywhere; padding:13px; border-radius:6px; background:#172331; color:#e7f1fa; max-height:420px; overflow:auto; }
    @media (max-width:720px) {
      header { padding:18px 16px; } h1 { font-size:22px; } header p { font-size:14px; line-height:1.5; }
      main { margin:14px auto 32px; padding:0 10px; } section { margin:12px 0; padding:16px 14px; border-radius:8px; } h2 { font-size:18px; }
      .grid { grid-template-columns:1fr; gap:12px; } .wide { grid-column:span 1; } label { font-size:15px; }
      input,select,textarea { min-height:48px; font-size:16px; } textarea { min-height:78px; } button { min-height:48px; font-size:16px; }
      .worker-row { grid-template-columns:1fr; gap:9px; padding:14px; } .worker-row label { font-size:14px; } .worker-row button,.workers>#addWorker { width:100%; }
      .actions { gap:9px; } .actions button { flex:1 1 100%; } .notice { font-size:14px; }
      table,tbody,tr,td { display:block; width:100%; } table { font-size:14px; } thead { display:none; } tr { margin:12px 0; padding:10px; border:1px solid var(--line); border-radius:7px; background:#fff; } th,td { border:0; padding:5px 0; } td { display:grid; grid-template-columns:86px minmax(0,1fr); gap:8px; line-height:1.5; overflow-wrap:anywhere; } td::before { content:attr(data-label); color:#486174; font-weight:700; } td:last-child { display:block; margin-top:8px; } td:last-child::before { content:""; } td:last-child button { width:100%; }
      dialog { width:calc(100% - 18px); max-height:calc(100% - 18px); } .dialog-body { padding:18px 14px; } pre { max-height:45vh; font-size:12px; padding:10px; }
    }
  </style>
</head>
<body>
  <header><h1>タイセイ建工 日報入力</h1><p>入力内容を確認して、Google Driveの日報専用フォルダーへ送信します。</p></header>
  <main>
    <section class="notice">日報を送信すると、Google Driveへ安全に送信されます。Windowsの取込処理が日報Excelと月間日報へ反映します。<br><strong id="draftStatus">下書きを確認中です。</strong></section>
    <section>
      <h2>現場の日報を追加</h2>
      <div class="grid">
        <label>日付<input id="date" type="date" required></label>
        <label class="wide">現場名<input id="site" type="text" placeholder="例：○○現場" required></label>
        <label class="wide">作業内容<textarea id="content" placeholder="例：屋根下塗り" required></textarea></label>
        <label class="wide">進捗状況<textarea id="progress" placeholder="例：屋根下塗り完了" required></textarea></label>
      </div>
      <div class="workers"><h3>作業者</h3><div id="workers"></div><button id="addWorker" class="secondary" type="button">作業者を追加</button></div>
      <p id="error" class="error" aria-live="polite"></p>
      <div class="actions"><button id="add" type="button">入力一覧へ追加</button><button id="sample" class="secondary" type="button">サンプルを入れる</button><button id="clear" class="secondary" type="button">入力を消す</button></div>
    </section>
    <section>
      <h2>確認する日報</h2><p id="count" class="count">0現場・0行・0人工</p>
      <div id="table"></div>
      <div class="actions"><button id="confirm" type="button">内容を確認して確定へ</button><button id="clearAll" class="danger" type="button">一覧をすべて消す</button></div>
    </section>
  </main>
  <dialog id="dialog"><div class="dialog-body"><h2>確定前の確認</h2><p>下の内容をGoogle Driveの日報専用フォルダーへ送信します。Excelへの反映はWindowsの取込処理で行います。</p><pre id="json"></pre><p id="confirmError" class="error" aria-live="polite"></p><div class="actions"><button id="save" type="button">日報を送信</button><button id="cancel" class="secondary" type="button">戻る</button></div></div></dialog>
  <script>
    const rows=[]; const el=id=>document.getElementById(id); const value=id=>el(id).value.trim(); const DRAFT_KEY='taisei-daily-input-draft-v1';
    el('date').value=new Date().toISOString().slice(0,10);
    const workerTemplate=({name='',start='08:30',end='17:00',mark='○'}={})=>`<div class="worker-row"><label>氏名<input class="worker-name" value="${escapeHtml(name)}" placeholder="例：作業者A"></label><label>開始時刻<input class="worker-start" type="time" value="${start}"></label><label>終了時刻<input class="worker-end" type="time" value="${end}"></label><label>○△<select class="worker-mark"><option value="○" ${mark==='○'?'selected':''}>○（1人工）</option><option value="△" ${mark==='△'?'selected':''}>△（0.5人工）</option></select></label><button class="danger remove-worker" type="button">削除</button></div>`;
    const escapeHtml=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function addWorker(data={}) { el('workers').insertAdjacentHTML('beforeend',workerTemplate(data)); el('workers').lastElementChild.querySelector('.remove-worker').onclick=e=>{e.currentTarget.closest('.worker-row').remove();saveDraft();}; }
    const showError=text=>el('error').textContent=text;
    function currentRecords(){ return [...document.querySelectorAll('.worker-row')].map(row=>({'日付':value('date'),'現場名':value('site'),'作業時間':`${row.querySelector('.worker-start').value}〜${row.querySelector('.worker-end').value}`,'作業者':row.querySelector('.worker-name').value.trim(),'○△':row.querySelector('.worker-mark').value,'作業内容':value('content'),'進捗状況':value('progress')})); }
    function validate(newRows){
      if(!newRows.length) return '作業者を1人以上追加してください。';
      for(const r of newRows){if(Object.values(r).some(v=>!v)) return 'すべての項目を入力してください。'; if(!/^\d{4}-\d{2}-\d{2}$/.test(r['日付'])) return '日付を確認してください。'; const [start,end]=r['作業時間'].split('〜');if(end<=start)return '終了時刻は開始時刻より後にしてください。';if(rows.some(x=>x['日付']===r['日付']&&x['現場名']===r['現場名']&&x['作業者']===r['作業者'])||newRows.filter(x=>x['作業者']===r['作業者']).length>1)return '同じ日付・現場・作業者は1回だけ登録できます。';} return '';
    }
    function render(){ const total=rows.reduce((n,r)=>n+(r['○△']==='○'?1:.5),0), groups=[...new Set(rows.map(r=>r['日付']+'|'+r['現場名']))]; el('count').textContent=`${groups.length}現場・${rows.length}行・${total}人工`; if(!rows.length){el('table').innerHTML='<p class="empty">まだ日報は追加されていません。</p>';return;} el('table').innerHTML=`<table><thead><tr><th>日付・現場</th><th>作業者・時間・○△</th><th>人工</th><th>作業内容</th><th>進捗状況</th><th></th></tr></thead><tbody>${groups.map(key=>{const rs=rows.filter(r=>r['日付']+'|'+r['現場名']===key),first=rs[0],subtotal=rs.reduce((n,r)=>n+(r['○△']==='○'?1:.5),0);return `<tr><td data-label="日付・現場">${escapeHtml(first['日付'])}<br>${escapeHtml(first['現場名'])}</td><td data-label="作業者">${rs.map(r=>`${escapeHtml(r['作業者'])} ${r['作業時間']} ${r['○△']}`).join('<br>')}</td><td data-label="人工">${subtotal}人工</td><td data-label="作業内容">${escapeHtml(first['作業内容'])}</td><td data-label="進捗状況">${escapeHtml(first['進捗状況'])}</td><td data-label=""><button class="danger" type="button" data-delete="${escapeHtml(key)}">現場を削除</button></td></tr>`}).join('')}</tbody></table>`; document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const key=b.dataset.delete; for(let i=rows.length-1;i>=0;i--)if(rows[i]['日付']+'|'+rows[i]['現場名']===key)rows.splice(i,1);render();}); }
    function workerInputs(){return [...document.querySelectorAll('.worker-row')].map(row=>({name:row.querySelector('.worker-name').value,start:row.querySelector('.worker-start').value,end:row.querySelector('.worker-end').value,mark:row.querySelector('.worker-mark').value}));}
    function saveDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({date:el('date').value,site:el('site').value,content:el('content').value,progress:el('progress').value,workers:workerInputs(),rows}));el('draftStatus').textContent='下書きをこの端末に保存しました。';}catch{el('draftStatus').textContent='この開き方では下書き保存を利用できません。Safariで開いてください。';}}
    function clearDraft(){try{localStorage.removeItem(DRAFT_KEY);}catch{}el('draftStatus').textContent='下書きを消去しました。';}
    function restoreDraft(){try{const draft=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');if(!draft){addWorker();el('draftStatus').textContent='下書きはありません。';return;}el('date').value=draft.date||el('date').value;el('site').value=draft.site||'';el('content').value=draft.content||'';el('progress').value=draft.progress||'';el('workers').innerHTML='';(draft.workers?.length?draft.workers:[{}]).forEach(addWorker);rows.push(...(Array.isArray(draft.rows)?draft.rows:[]));el('draftStatus').textContent='保存済みの下書きを復元しました。';}catch{addWorker();el('draftStatus').textContent='下書きを読み込めませんでした。';}}
    function clearForm(){['site','content','progress'].forEach(id=>el(id).value='');el('workers').innerHTML='';addWorker();showError('');saveDraft();el('site').focus();}
    el('addWorker').onclick=()=>{addWorker();saveDraft();}; el('add').onclick=()=>{const newRows=currentRecords(),message=validate(newRows);if(message){showError(message);return;}rows.push(...newRows);clearForm();render();saveDraft();};
    el('sample').onclick=()=>{rows.length=0;rows.push({'日付':'2026-01-01','現場名':'サンプル現場A','作業時間':'08:30〜17:00','作業者':'作業者A','○△':'○','作業内容':'サンプル作業','進捗状況':'作業中'},{'日付':'2026-01-01','現場名':'サンプル現場A','作業時間':'08:30〜17:00','作業者':'作業者B','○△':'○','作業内容':'サンプル作業','進捗状況':'作業中'},{'日付':'2026-01-01','現場名':'サンプル現場A','作業時間':'08:30〜12:00','作業者':'作業者C','○△':'△','作業内容':'サンプル作業','進捗状況':'作業中'},{'日付':'2026-01-01','現場名':'サンプル現場A','作業時間':'13:00〜17:00','作業者':'作業者D','○△':'△','作業内容':'サンプル作業','進捗状況':'作業中'},{'日付':'2026-01-01','現場名':'サンプル現場B','作業時間':'13:00〜17:00','作業者':'作業者E','○△':'△','作業内容':'サンプル作業','進捗状況':'作業中'});showError('');render();saveDraft();};
    el('clear').onclick=clearForm; el('clearAll').onclick=()=>{if(confirm('一覧の内容をすべて消しますか？')){rows.length=0;render();clearDraft();}}; el('confirm').onclick=()=>{if(!rows.length){showError('確定する日報を1行以上追加してください。');return;}el('json').textContent=JSON.stringify(rows,null,2);el('confirmError').textContent='';el('dialog').showModal();}; el('cancel').onclick=()=>el('dialog').close(); document.addEventListener('input',saveDraft);document.addEventListener('change',saveDraft);restoreDraft();render();
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app-config.js"></script>
  <script src="google-drive-send.js"></script>
</body>
</html>
